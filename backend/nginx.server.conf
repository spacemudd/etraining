fastcgi_cache_path /dev/shm levels=1:2 keys_zone=laravel:100m;
fastcgi_cache_key "$scheme$request_method$host$request_uri$query_string";

# Prefer Cloudflare client IP when present (droplet behind CF).
map $http_cf_connecting_ip $client_ip_key {
    "" $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $client_ip_key zone=login:10m rate=1r/s;
limit_req_zone $client_ip_key zone=general:10m rate=5r/s;

server {
   listen [::]:8085 default_server;
   listen 8085 default_server;
   server_name _;

   server_tokens off;
   fastcgi_hide_header X-Powered-By;
   proxy_hide_header X-Powered-By;

   root   /var/www/html/public;
   index  index.php index.html;

   client_max_body_size 500M;
   client_body_timeout 300s;
   client_header_timeout 300s;
   proxy_connect_timeout 300s;
   proxy_send_timeout 300s;
   proxy_read_timeout 300s;
   large_client_header_buffers 4 32k;

   # Compression
   # Enable Gzip compressed.
   gzip on;

   # Enable compression both for HTTP/1.0 and HTTP/1.1.
   gzip_http_version  1.1;

   # Compression level (1-9).
   # 5 is a perfect compromise between size and cpu usage, offering about
   # 75% reduction for most ascii files (almost identical to level 9).
   gzip_comp_level    5;

   # Don't compress anything that's already small and unlikely to shrink much
   # if at all (the default is 20 bytes, which is bad as that usually leads to
   # larger files after gzipping).
   gzip_min_length    256;

   # Compress data even for clients that are connecting to us via proxies,
   # identified by the "Via" header (required for CloudFront).
   gzip_proxied       any;

   # Tell proxies to cache both the gzipped and regular version of a resource
   # whenever the client's Accept-Encoding capabilities header varies;
   # Avoids the issue where a non-gzip capable client (which is extremely rare
   # today) would display gibberish if their proxy gave them the gzipped version.
   gzip_vary          on;

   # Compress all output labeled with one of the following MIME-types.
   gzip_types
     application/atom+xml
     application/javascript
     application/json
     application/rss+xml
     application/vnd.ms-fontobject
     application/x-font-ttf
     application/x-web-app-manifest+json
     application/xhtml+xml
     application/xml
     font/opentype
     image/svg+xml
     image/x-icon
     text/css
     text/plain
     text/x-component;
     # text/html is always compressed by HttpGzipModule

   location /healthcheck {
       access_log off;
       return 200 "healthy\n";
       add_header Content-Type text/plain;
   }

   location ~ ^/(login|register|password|logout|2fa|auth|api/auth) {
       limit_req zone=login burst=3 nodelay;
       limit_req_status 429;
       try_files $uri $uri/ /index.php?$query_string;
   }

   location / {
       limit_req zone=general burst=20 nodelay;
       limit_req_status 429;
       try_files $uri $uri/ /index.php?$query_string;
   }

   location ~ \.php$ {
       fastcgi_cache laravel;
       #fastcgi_cache_valid 200 204 1m;
       fastcgi_ignore_headers Cache-Control;
       fastcgi_no_cache $http_authorization $cookie_laravel_session;
       fastcgi_cache_lock on;
       fastcgi_cache_lock_timeout 10s;
       add_header X-Proxy-Cache $upstream_cache_status;
       fastcgi_pass unix:/var/run/php-fpm.sock;
       fastcgi_keep_conn on;
       fastcgi_index  index.php;
       fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
       fastcgi_read_timeout 900s;
       include        fastcgi_params;
   }

   location ~* \.(jpg|jpeg|png|gif|ico|css|js|eot|ttf|woff|woff2|pdf|doc|docx)$ {
       expires max;
       add_header Cache-Control public;
       add_header Access-Control-Allow-Origin *;
       access_log off;
       try_files $uri $uri/ /index.php?$query_string;
   }

   location ~ /\. {
        log_not_found off;
       deny all;
   }

   # Allow fpm ping and status from localhost
   location ~ ^/(fpm-status|fpm-ping)$ {
       access_log off;
       #allow 127.0.0.1;
       #deny all;
       fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
       include fastcgi_params;
       fastcgi_pass unix:/var/run/php-fpm.sock;
   }
}
